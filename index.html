<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayaking Booking Manager</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 10px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 5px;
}

.pay {
  background: green;
}
</style>
</head>

<body>

<h2>Kayaking Booking Manager</h2>

<!-- OWNER FORM -->
<div class="card">
  <input id="operator" placeholder="Operator Name">
  <input id="datetime" type="datetime-local">
  <input id="customers" type="number" placeholder="No of Customers">
  <input id="amount" type="number" placeholder="Amount ₹">
  <button onclick="addBooking()">Add Booking</button>
</div>

<!-- OPERATOR LINK BOX -->
<div class="card" id="linkBox" style="display:none;">
  <b>Operator Link</b>
  <input id="operatorLink" readonly>
  <button onclick="copyLink()">Copy Link</button>
</div>

<!-- BOOKINGS DISPLAY -->
<div id="bookings"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================
   CONFIGURATION
============================ */

const OWNER_UPI = "astonnoronha123@okhdfcbank";

const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "owner";
const bookingId = params.get("id");

/* ============================
   FIREBASE INIT
============================ */

const firebaseConfig = {
  apiKey: "AIzaSyANyCnvvN84F1IKRGQAzoNSiWTcVFjWR3I",
  authDomain: "kaykbook-43ac4.firebaseapp.com",
  projectId: "kaykbook-43ac4",
  storageBucket: "kaykbook-43ac4.firebasestorage.app",
  messagingSenderId: "407645371594",
  appId: "1:407645371594:web:364808bc1d1c0712f10833",
  measurementId: "G-RWD8JJ8M37"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   UI MODE CONTROL
============================ */

window.onload = () => {
  if (role === "operator") {
    document.querySelector(".card").style.display = "none";
  }
};

/* ============================
   ADD BOOKING (OWNER ONLY)
============================ */

function addBooking() {

  if (role !== "owner") return alert("Only owner can create bookings.");

  db.collection("bookings").add({
    operator: operator.value,
    datetime: datetime.value,
    customers: customers.value,
    amount: amount.value,
    upiId: OWNER_UPI,
    status: "Pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(doc => {
    const operatorLink =
      `${location.origin}${location.pathname}?role=operator&id=${doc.id}`;

    document.getElementById("linkBox").style.display = "block";
    document.getElementById("operatorLink").value = operatorLink;
  });
}

/* ============================
   COPY LINK
============================ */

function copyLink() {
  const input = document.getElementById("operatorLink");
  input.select();
  document.execCommand("copy");
  alert("Operator link copied.");
}

/* ============================
   LOAD BOOKINGS
============================ */

let query = db.collection("bookings").orderBy("createdAt","desc");

if (role === "operator" && bookingId) {
  query = db.collection("bookings").where(
    firebase.firestore.FieldPath.documentId(),
    "==",
    bookingId
  );
}

query.onSnapshot(snapshot => {
  let html = "";

  snapshot.forEach(doc => {
    const d = doc.data();
    const gpayLink =
      `upi://pay?pa=${encodeURIComponent(d.upiId)}&pn=Kayaking&am=${d.amount}&cu=INR`;

    html += `
      <div class="card">
        <b>${d.operator}</b><br>
        📅 ${d.datetime}<br>
        👥 Customers: ${d.customers}<br>
        💰 ₹${d.amount}<br>
        ✅ Status: ${d.status}<br><br>

        ${
          role === "operator"
          ? `<button class="pay" onclick="payNow('${gpayLink}')">Pay Now</button>`
          : ""
        }

        ${
          role === "operator" && d.status !== "Paid"
          ? `<button onclick="markPaid('${doc.id}')">Confirm Paid</button>`
          : ""
        }
      </div>
    `;
  });

  document.getElementById("bookings").innerHTML = html;
});

/* ============================
   PAY NOW
============================ */

function payNow(link) {
  window.location.href = link;
}

/* ============================
   MARK PAID
============================ */

function markPaid(id){
  if (role !== "operator") return alert("Only operator can confirm payment.");

  db.collection("bookings").doc(id).update({
    status: "Paid"
  });
}
</script>

</body>
</html>
