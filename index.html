<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayaking Booking Manager</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 10px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
}

input, button, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 5px;
}

.pay { background: green; }
.danger { background: #dc3545; }
.gray { background: #6c757d; }
</style>
</head>

<body>

<h2 id="pageTitle">Kayaking Booking Manager</h2>

<!-- OWNER FILTER -->
<div class="card" id="monthFilterBox">
  <b>Filter by Month</b>
  <select id="monthFilter" onchange="applyMonthFilter()">
    <option value="all">All</option>
  </select>
</div>

<!-- OWNER FORM -->
<div class="card" id="ownerForm">
  <input id="operator" placeholder="Operator Name">
  <input id="datetime" type="datetime-local">
  <input id="customers" type="number" placeholder="No of Customers">
  <input id="amount" type="number" placeholder="Amount ₹">
  <button onclick="addBooking()">Add Booking</button>
</div>

<!-- OPERATOR LINK BOX -->
<div class="card" id="linkBox" style="display:none;">
  <b>Operator Link</b>
  <input id="operatorLink" readonly>
  <button onclick="copyLink()">Copy Link</button>
</div>

<!-- PENDING SUMMARY (OWNER) -->
<div class="card" id="pendingSummary" style="display:none;">
  <b>Pending Payments by Operator</b>
  <div id="pendingList"></div>
</div>

<!-- BOOKINGS DISPLAY -->
<div id="bookings"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================
   CONFIGURATION
============================ */

const OWNER_UPI = "astonnoronha123@okhdfcbank";

const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "owner";
const bookingId = params.get("id");

/* ============================
   FIREBASE INIT
============================ */

const firebaseConfig = {
  apiKey: "AIzaSyANyCnvvN84F1IKRGQAzoNSiWTcVFjWR3I",
  authDomain: "kaykbook-43ac4.firebaseapp.com",
  projectId: "kaykbook-43ac4",
  storageBucket: "kaykbook-43ac4.firebasestorage.app",
  messagingSenderId: "407645371594",
  appId: "1:407645371594:web:364808bc1d1c0712f10833"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   UI MODE CONTROL
============================ */

window.onload = () => {
  const title = document.getElementById("pageTitle");
  if (role === "operator") {
    title.innerText = "Today's Activities & Payment";
    ownerForm.style.display = "none";
    linkBox.style.display = "none";
    monthFilterBox.style.display = "none";
    pendingSummary.style.display = "none";
  }
};

/* ============================
   ADD BOOKING
============================ */

function addBooking() {
  if (!operator.value || !datetime.value || !customers.value || !amount.value) {
    alert("Please fill all fields.");
    return;
  }

  db.collection("bookings").add({
    operator: operator.value.trim(),
    operatorKey: operator.value.trim().toLowerCase(),
    datetime: datetime.value,
    customers: customers.value,
    amount: amount.value,
    upiId: OWNER_UPI,
    status: "Pending",
    activityDone: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(doc => {
    const operatorLink =
      `${location.origin}${location.pathname}?role=operator&id=${doc.id}`;

    linkBox.style.display = "block";
    operatorLinkInput.value = operatorLink;
  });
}

/* ============================
   COPY LINK
============================ */

function copyLink() {
  navigator.clipboard.writeText(operatorLinkInput.value);
  alert("Link copied.");
}

/* ============================
   PAYMENT LINK (SAFE FORMAT)
============================ */

function payNow(upi, amount) {
  const link =
    `upi://pay?pa=${encodeURIComponent(upi)}` +
    `&pn=VictoryKayaking` +
    `&am=${amount}` +
    `&cu=INR`;

  window.location.href = link;
}

/* ============================
   DATA LOAD
============================ */

let allBookings = [];

let query = db.collection("bookings").orderBy("createdAt","desc");

if (role === "operator" && bookingId) {
  query = db.collection("bookings").where(
    firebase.firestore.FieldPath.documentId(),
    "==",
    bookingId
  );
}

query.onSnapshot(snapshot => {
  allBookings = [];
  const monthSet = new Set();

  snapshot.forEach(doc => {
    const d = doc.data();
    d.id = doc.id;
    allBookings.push(d);
    if (d.datetime) monthSet.add(d.datetime.slice(0,7));
  });

  populateMonthFilter([...monthSet].sort());
  renderBookings(allBookings);
  buildPendingSummary(allBookings);
});

/* ============================
   MONTH FILTER
============================ */

function populateMonthFilter(months) {
  if (role !== "owner") return;
  monthFilter.innerHTML = `<option value="all">All</option>`;
  months.forEach(m => {
    const o = document.createElement("option");
    o.value = m;
    o.textContent = m;
    monthFilter.appendChild(o);
  });
}

function applyMonthFilter() {
  const m = monthFilter.value;
  renderBookings(
    m === "all"
      ? allBookings
      : allBookings.filter(b => b.datetime?.startsWith(m))
  );
}

/* ============================
   PENDING SUMMARY (OWNER)
============================ */

function buildPendingSummary(data) {
  if (role !== "owner") return;

  const pending = data.filter(d => d.status === "Pending");
  const grouped = {};

  pending.forEach(p => {
    const key = p.operatorKey;
    grouped[key] = grouped[key] || { name: p.operator, ids: [] };
    grouped[key].ids.push(p.id);
  });

  let html = "";
  Object.values(grouped).forEach(g => {
    const link =
      `${location.origin}${location.pathname}?role=operator&ids=${g.ids.join(",")}`;
    html += `<div><b>${g.name}</b> — ${g.ids.length} pending
      <button onclick="navigator.clipboard.writeText('${link}')">Copy Link</button></div>`;
  });

  pendingSummary.style.display = html ? "block" : "none";
  pendingList.innerHTML = html || "No pending payments.";
}

/* ============================
   RENDER BOOKINGS
============================ */

function renderBookings(bookings) {
  let html = "";

  bookings.forEach(d => {
    html += `
      <div class="card">
        <b>${d.operator}</b><br>
        📅 ${d.datetime}<br>
        👥 Customers: ${d.customers}<br>
        💰 ₹${d.amount}<br>
        💳 Payment: ${d.status}<br>
        🛶 Activity: ${d.activityDone ? "Completed" : "Pending"}<br><br>

        ${
          role === "operator" && d.status !== "Paid"
          ? `<button class="pay" onclick="payNow('${d.upiId}','${d.amount}')">Pay Now</button>`
          : ""
        }

        ${
          role === "operator" && !d.activityDone
          ? `<button class="gray" onclick="confirmActivity('${d.id}')">Confirm Activity</button>`
          : ""
        }

        ${
          role === "owner"
          ? `
            ${d.status !== "Paid" ? `<button onclick="markPaid('${d.id}')">Mark Paid</button>` : ""}
            <button onclick='editBooking(${JSON.stringify(d)})'>Edit</button>
            <button class="danger" onclick="deleteBooking('${d.id}')">Delete</button>
          `
          : ""
        }
      </div>
    `;
  });

  bookingsDiv.innerHTML = html;
}

/* ============================
   OWNER CONTROLS
============================ */

function markPaid(id){
  db.collection("bookings").doc(id).update({ status: "Paid" });
}

function editBooking(d){
  const operator = prompt("Operator:", d.operator);
  const datetime = prompt("Datetime:", d.datetime);
  const customers = prompt("Customers:", d.customers);
  const amount = prompt("Amount:", d.amount);
  if (!operator || !datetime || !customers || !amount) return;

  db.collection("bookings").doc(d.id).update({
    operator,
    operatorKey: operator.toLowerCase(),
    datetime,
    customers,
    amount
  });
}

function deleteBooking(id){
  if (!confirm("Delete this booking permanently?")) return;
  db.collection("bookings").doc(id).delete();
}

/* ============================
   OPERATOR ACTIVITY CONFIRM
============================ */

function confirmActivity(id){
  db.collection("bookings").doc(id).update({
    activityDone: true
  });
}
</script>

</body>
</html>
