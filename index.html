<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================
   CONFIGURATION
============================ */

// 🔴 OWNER UPI ID (CHANGE THIS)
const OWNER_UPI = "astonnoronha123@okhdfcbank";

// Read role & booking id from URL
const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "owner";     // owner | operator
const bookingId = params.get("id");

/* ============================
   FIREBASE INIT
============================ */

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   UI MODE CONTROL
============================ */

if (role === "operator") {
  document.querySelector(".card").style.display = "none"; // hide booking form
}

/* ============================
   ADD BOOKING (OWNER ONLY)
============================ */

function addBooking() {

  if (role !== "owner") return alert("Only owner can create bookings.");

  db.collection("bookings").add({
    operator: operator.value,
    datetime: datetime.value,
    customers: customers.value,
    amount: amount.value,
    upiId: OWNER_UPI,            // Always owner's UPI
    status: "Pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(doc => {
      const operatorLink =
        `${location.origin}${location.pathname}?role=operator&id=${doc.id}`;

      alert("Send this link to operator:\n\n" + operatorLink);
  });
}

/* ============================
   LOAD BOOKINGS
============================ */

let query = db.collection("bookings").orderBy("createdAt","desc");

if (role === "operator" && bookingId) {
  query = db.collection("bookings").where(
    firebase.firestore.FieldPath.documentId(),
    "==",
    bookingId
  );
}

query.onSnapshot(snapshot => {
  let html = "";

  snapshot.forEach(doc => {
    const d = doc.data();

    const gpayLink =
      `upi://pay?pa=${encodeURIComponent(d.upiId)}&pn=Kayaking&am=${d.amount}&cu=INR`;

    html += `
    <div class="card">
      <b>${d.operator}</b><br>
      📅 ${d.datetime}<br>
      👥 Customers: ${d.customers}<br>
      💰 ₹${d.amount}<br>
      ✅ Status: ${d.status}<br><br>

      <a href="${gpayLink}">
        <button class="pay">Pay Now</button>
      </a>

      ${
        role === "operator" && d.status !== "Paid"
        ? `<button onclick="markPaid('${doc.id}')">Confirm Paid</button>`
        : ""
      }
    </div>`;
  });

  document.getElementById("bookings").innerHTML = html;
});

/* ============================
   MARK PAID (OPERATOR ONLY)
============================ */

function markPaid(id){
  if (role !== "operator") return alert("Only operator can confirm payment.");

  db.collection("bookings").doc(id).update({
    status: "Paid"
  });
}
</script>
