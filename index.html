<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================
   CONFIGURATION
============================ */

// ✅ OWNER UPI ID
const OWNER_UPI = "astonnoronha123@okhdfcbank";

// ✅ Role detection
const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "owner";     // owner | operator
const bookingId = params.get("id");

/* ============================
   FIREBASE INIT (PUT YOUR REAL KEYS)
============================ */

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "kaykbook-43ac4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   UI MODE CONTROL
============================ */

window.onload = () => {
  if (role === "operator") {
    const form = document.querySelector(".card");
    if (form) form.style.display = "none";
  }
};

/* ============================
   ADD BOOKING (OWNER ONLY)
============================ */

function addBooking() {

  if (role !== "owner") {
    alert("Only owner can create bookings.");
    return;
  }

  db.collection("bookings").add({
    operator: operator.value,
    datetime: datetime.value,
    customers: customers.value,
    amount: amount.value,
    upiId: OWNER_UPI,
    status: "Pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(doc => {
    const operatorLink =
      `${location.origin}${location.pathname}?role=operator&id=${doc.id}`;

    alert("Send this link to operator:\n\n" + operatorLink);
  });
}

/* ============================
   LOAD BOOKINGS
============================ */

let query = db.collection("bookings").orderBy("createdAt","desc");

if (role === "operator" && bookingId) {
  query = db.collection("bookings").where(
    firebase.firestore.FieldPath.documentId(),
    "==",
    bookingId
  );
}

query.onSnapshot(snapshot => {
  let html = "";

  snapshot.forEach(doc => {
    const d = doc.data();

    const gpayLink =
      `upi://pay?pa=${encodeURIComponent(d.upiId)}&pn=Kayaking&am=${d.amount}&cu=INR`;

    html += `
    <div class="card">
      <b>${d.operator}</b><br>
      📅 ${d.datetime}<br>
      👥 Customers: ${d.customers}<br>
      💰 ₹${d.amount}<br>
      ✅ Status: ${d.status}<br><br>

      <button class="pay" onclick="payNow('${gpayLink}')">
        Pay Now
      </button>

      ${
        role === "operator" && d.status !== "Paid"
        ? `<button onclick="markPaid('${doc.id}')">Confirm Paid</button>`
        : ""
      }
    </div>`;
  });

  const container = document.getElementById("bookings");
  if (container) container.innerHTML = html;
});

/* ============================
   PAY NOW FIX
============================ */

function payNow(link) {
  window.location.href = link;
}

/* ============================
   MARK PAID (OPERATOR ONLY)
============================ */

function markPaid(id){
  if (role !== "operator") {
    alert("Only operator can confirm payment.");
    return;
  }

  db.collection("bookings").doc(id).update({
    status: "Paid"
  });
}
</script>
