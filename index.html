<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayaking Booking Manager</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 10px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
}

input, button, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 5px;
}

.done { background: #198754; }
.danger { background: #dc3545; }
.small { font-size: 13px; color: #444; }
</style>
</head>

<body>

<h2 id="pageTitle">Kayaking Booking Manager</h2>

<div id="bookings"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================
   CONFIGURATION
============================ */

const OWNER_UPI = "astonnoronha123@okhdfcbank";

const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "owner";

/* ============================
   FIREBASE INIT
============================ */

const firebaseConfig = {
  apiKey: "AIzaSyANyCnvvN84F1IKRGQAzoNSiWTcVFjWR3I",
  authDomain: "kaykbook-43ac4.firebaseapp.com",
  projectId: "kaykbook-43ac4",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   LOAD BOOKINGS
============================ */

db.collection("bookings")
  .orderBy("createdAt","desc")
  .onSnapshot(snapshot => {

    const bookings = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      data.id = doc.id;
      bookings.push(data);
    });

    renderBookings(bookings);
  });

/* ============================
   RENDER BOOKINGS
============================ */

function renderBookings(bookings) {
  let html = "";

  bookings.forEach(d => {

    html += `
      <div class="card">
        <b>${d.operator}</b><br>
        📅 ${d.datetime}<br>
        👥 Customers: ${d.customers}<br>
        💰 Amount: ₹${d.amount}<br>
        ✅ Status: ${d.status}<br><br>

        ${
          role === "operator" && d.status === "Pending"
          ? `
            <div class="small">
              <b>Pay manually using any UPI app:</b><br>
              ${OWNER_UPI}<br>
              <button onclick="copyUPI()">Copy UPI</button>

              <input id="ref_${d.id}" placeholder="Enter Transaction Reference ID">
              <button onclick="submitPayment('${d.id}')">Submit Payment</button>
            </div>
          `
          : ""
        }

        ${
          role === "owner" && d.status === "Verification"
          ? `
            <b>Transaction Ref:</b> ${d.txnRef || "-"}<br><br>
            <button class="done" onclick="approvePayment('${d.id}')">
              Approve Payment
            </button>
          `
          : ""
        }

        ${
          role === "owner"
          ? `
            <button class="danger" onclick="deleteBooking('${d.id}')">
              Delete Booking
            </button>
          `
          : ""
        }

      </div>
    `;
  });

  document.getElementById("bookings").innerHTML = html;
}

/* ============================
   ACTIONS
============================ */

function copyUPI() {
  navigator.clipboard.writeText(OWNER_UPI);
  alert("UPI ID copied.");
}

function submitPayment(id) {
  const ref = document.getElementById(`ref_${id}`).value.trim();
  if (!ref) return alert("Please enter transaction reference number.");

  db.collection("bookings").doc(id).update({
    status: "Verification",
    txnRef: ref,
    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("Payment submitted for verification.");
}

function approvePayment(id) {
  if (!confirm("Confirm payment received?")) return;

  db.collection("bookings").doc(id).update({
    status: "Paid",
    verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

function deleteBooking(id) {
  if (!confirm("Delete this booking permanently?")) return;
  db.collection("bookings").doc(id).delete();
}
</script>

</body>
</html>
