<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kayaking Booking Manager</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 16px; }
    .card { max-width: 680px; margin: 0 auto 12px; background: #fff; padding: 16px; border-radius: 10px; }
    input, button { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 8px; }
    button { background: #0d6efd; color: #fff; border: 0; border-radius: 5px; cursor: pointer; }
    .danger { background: #dc3545; }
    .muted { color: #555; font-size: .9rem; }
    .hidden { display: none; }
    .booking { border-top: 1px solid #ddd; padding: 12px 0; }
    .booking:first-child { border-top: 0; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kayaking Booking Manager</h2>
    <p id="status" class="muted">Please sign in.</p>
  </div>

  <section id="loginCard" class="card">
    <h3>Owner Sign In</h3>
    <input id="email" type="email" autocomplete="email" placeholder="Email address">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="loginButton">Sign in</button>
    <p class="muted">Owner access only. Never store passwords in Firestore.</p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <button id="logoutButton" class="danger">Sign out</button>
    </div>

    <section id="ownerPanel" class="card hidden">
      <h3>Add booking</h3>
      <input id="operatorName" placeholder="Operator name" maxlength="80">
      <input id="datetime" type="datetime-local">
      <input id="customers" type="number" min="1" placeholder="Number of customers">
      <input id="amount" type="number" min="1" step="0.01" placeholder="Amount (₹)">
      <button id="addButton">Add booking</button>
    </section>

    <section class="card">
      <h3>All bookings</h3>
      <div id="bookings"></div>
    </section>
  </section>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      authDomain: "kaykbook-43ac4.firebaseapp.com",
      projectId: "kaykbook-43ac4",
      storageBucket: "kaykbook-43ac4.firebasestorage.app",
      messagingSenderId: "407645371594",
      appId: "1:407645371594:web:364808bc1d1c0712f10833"
    };

    const OWNER_UPI = "eltonnoronha102@okhdfcbank";

    // Replace with your Firebase Authentication owner's UID.
    const OWNER_UID = "VZQjAt8bTYhYIvhP7MovUx8WQ3n1";

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    let unsubscribe = null;
    let user = null;

    const $ = id => document.getElementById(id);

    function setStatus(message) {
      $("status").textContent = message;
    }

    function show(id, visible) {
      $(id).classList.toggle("hidden", !visible);
    }

    $("loginButton").onclick = async () => {
      try {
        await auth.signInWithEmailAndPassword(
          $("email").value.trim(),
          $("password").value
        );
        $("password").value = "";
      } catch (error) {
        console.error(error);
        alert("Incorrect email or password.");
      }
    };

    $("logoutButton").onclick = () => auth.signOut();

    auth.onAuthStateChanged(async signedInUser => {
      if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
      }

      user = signedInUser;
      $("bookings").replaceChildren();

      show("loginCard", !user);
      show("app", !!user);

      if (!user) {
        setStatus("Please sign in.");
        return;
      }

      if (OWNER_UID === "YOUR_OWNER_UID" || user.uid !== OWNER_UID) {
        setStatus("This account is not the owner account.");
        await auth.signOut();
        return;
      }

      setStatus(`Signed in as owner: ${user.email}`);
      show("ownerPanel", true);

      unsubscribe = db.collection("bookings").onSnapshot(
        renderBookings,
        error => {
          console.error(error);
          setStatus("You do not have permission to load bookings.");
        }
      );
    });

    $("addButton").onclick = async () => {
      if (!user) return;

      const operator = $("operatorName").value.trim();
      const datetime = $("datetime").value;
      const customers = Number($("customers").value);
      const amount = Number($("amount").value);

      if (
        !operator ||
        !datetime ||
        !Number.isInteger(customers) ||
        customers < 1 ||
        !Number.isFinite(amount) ||
        amount <= 0
      ) {
        alert("Enter valid booking details.");
        return;
      }

      try {
        await db.collection("bookings").add({
          operator,
          operatorKey: operator.toLowerCase(),
          datetime,
          customers,
          amount,
          upiId: OWNER_UPI,
          status: "Pending",
          activityDone: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        ["operatorName", "datetime", "customers", "amount"].forEach(id => {
          $(id).value = "";
        });
      } catch (error) {
        console.error(error);
        alert("Booking was not saved. Check Firestore Rules.");
      }
    };

    function addLine(parent, text) {
      const line = document.createElement("div");
      line.textContent = text;
      parent.append(line);
    }

    function makeButton(label, handler, className = "") {
      const button = document.createElement("button");
      button.textContent = label;
      button.className = className;
      button.onclick = handler;
      return button;
    }

    function renderBookings(snapshot) {
      const root = $("bookings");
      root.replaceChildren();

      if (snapshot.empty) {
        root.textContent = "No bookings found.";
        return;
      }

      snapshot.forEach(doc => {
        const booking = doc.data();
        const card = document.createElement("article");

        card.className = "booking";

        addLine(card, `Operator: ${booking.operator || "—"}`);
        addLine(card, `Date: ${booking.datetime || "—"}`);
        addLine(card, `Customers: ${booking.customers || 0}`);
        addLine(card, `Amount: ₹${Number(booking.amount || 0).toFixed(2)}`);
        addLine(card, `Payment: ${booking.status || "Pending"}`);
        addLine(
          card,
          booking.activityDone
            ? "Activity: Completed"
            : "Activity: Pending"
        );

        if (booking.status !== "Paid") {
          card.append(
            makeButton("Mark paid", () => markPaid(doc.id))
          );
        }

        card.append(
          makeButton("Delete booking", () => deleteBooking(doc.id), "danger")
        );

        root.append(card);
      });
    }

    async function markPaid(id) {
      await db.collection("bookings").doc(id).update({
        status: "Paid",
        paidAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    async function deleteBooking(id) {
      if (!confirm("Delete this booking permanently?")) return;
      await db.collection("bookings").doc(id).delete();
    }
  </script>
</body>
</html>
