<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayaking Booking Manager</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 10px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
}

input, button, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 5px;
}

.copy { background: #6c757d; }
.done { background: #198754; }
.danger { background: #dc3545; }
.small { font-size: 13px; color: #444; }
.info { font-size: 14px; margin-top: 5px; }
</style>
</head>

<body>

<h2 id="pageTitle">Kayaking Booking Manager</h2>

<!-- OWNER FILTER -->
<div class="card" id="monthFilterBox">
  <b>Filter by Month</b>
  <select id="monthFilter" onchange="applyMonthFilter()">
    <option value="all">All</option>
  </select>
</div>

<!-- PENDING OPERATORS LIST -->
<div class="card" id="pendingOperatorsBox">
  <b>Pending Payments by Operator</b>
  <div id="pendingOperators"></div>
</div>

<!-- OWNER FORM -->
<div class="card" id="ownerForm">
  <input id="operator" placeholder="Operator Name">
  <input id="datetime" type="datetime-local">
  <input id="customers" type="number" placeholder="No of Customers">
  <input id="amount" type="number" placeholder="Amount ₹">
  <button onclick="addBooking()">Add Booking</button>
</div>

<!-- OPERATOR LINK BOX -->
<div class="card" id="linkBox" style="display:none;">
  <b>Operator Link</b>
  <input id="operatorLink" readonly>
  <button onclick="copyText(operatorLink.value)">Copy Link</button>
</div>

<!-- BOOKINGS DISPLAY -->
<div id="bookings"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================
   CONFIGURATION
============================ */

const OWNER_UPI = "astonnoronha123@okhdfcbank";

const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "owner";
const bookingId = params.get("id");
const operatorFilter = params.get("operator");

/* ============================
   FIREBASE INIT
============================ */

const firebaseConfig = {
  apiKey: "AIzaSyANyCnvvN84F1IKRGQAzoNSiWTcVFjWR3I",
  authDomain: "kaykbook-43ac4.firebaseapp.com",
  projectId: "kaykbook-43ac4",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   UI MODE CONTROL
============================ */

window.onload = () => {
  const title = pageTitle;
  if (role === "operator") {
    title.innerText = "Payment Instructions";
    ownerForm.style.display = "none";
    linkBox.style.display = "none";
    monthFilterBox.style.display = "none";
    pendingOperatorsBox.style.display = "none";
  }
};

/* ============================
   ADD BOOKING
============================ */

function addBooking() {
  if (!operator.value || !datetime.value || !customers.value || !amount.value) {
    alert("Please fill all fields.");
    return;
  }

  db.collection("bookings").add({
    operator: operator.value.trim(),
    operatorKey: operator.value.trim().toLowerCase(),
    datetime: datetime.value,
    customers: Number(customers.value),
    amount: Number(amount.value),
    upiId: OWNER_UPI,
    status: "Pending",
    activityDone: false,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(doc => {
    const link =
      `${location.origin}${location.pathname}?role=operator&id=${doc.id}`;

    linkBox.style.display = "block";
    operatorLink.value = link;
  });
}

/* ============================
   COPY UTIL
============================ */

function copyText(text) {
  navigator.clipboard.writeText(text)
    .then(() => alert("Copied successfully"))
    .catch(() => alert("Copy failed"));
}

/* ============================
   LOAD BOOKINGS
============================ */

let allBookings = [];
let query = db.collection("bookings").orderBy("createdAt","desc");

if (role === "operator" && bookingId) {
  query = db.collection("bookings")
    .where(firebase.firestore.FieldPath.documentId(), "==", bookingId);
}

query.onSnapshot(snapshot => {
  allBookings = [];
  const months = new Set();

  snapshot.forEach(doc => {
    const data = doc.data();
    data.id = doc.id;
    allBookings.push(data);
    if (data.datetime) months.add(data.datetime.slice(0,7));
  });

  populateMonthFilter([...months]);
  buildPendingOperators(allBookings);
  applyFilters();
});

/* ============================
   FILTERS
============================ */

function populateMonthFilter(months) {
  if (role !== "owner") return;
  monthFilter.innerHTML = `<option value="all">All</option>`;
  months.forEach(m => {
    monthFilter.innerHTML += `<option value="${m}">${m}</option>`;
  });
}

function applyMonthFilter() {
  applyFilters();
}

function applyFilters() {
  let filtered = [...allBookings];

  const selectedMonth = monthFilter?.value;
  if (selectedMonth && selectedMonth !== "all") {
    filtered = filtered.filter(b => b.datetime?.startsWith(selectedMonth));
  }

  if (operatorFilter) {
    const key = operatorFilter.toLowerCase();
    filtered = filtered.filter(b => b.operatorKey === key);
  }

  renderBookings(filtered);
}

/* ============================
   PENDING OPERATORS
============================ */

function buildPendingOperators(bookings) {
  if (role !== "owner") return;

  const map = {};
  bookings.forEach(b => {
    if (b.status !== "Pending") return;
    const key = b.operatorKey;
    map[key] = map[key] || { name: b.operator, count: 0 };
    map[key].count++;
  });

  let html = "";
  Object.keys(map).forEach(key => {
    const link =
      `${location.origin}${location.pathname}?role=operator&operator=${encodeURIComponent(key)}`;
    html += `
      <div class="small">
        <b>${map[key].name}</b> — ${map[key].count} pending<br>
        <button onclick="copyText('${link}')">Copy Operator Link</button>
      </div><hr>
    `;
  });

  pendingOperators.innerHTML = html || "<i>No pending payments.</i>";
}

/* ============================
   ACTIVITY CONFIRMATION
============================ */

function confirmActivity(id) {
  if (!confirm("Confirm that activity has been completed?")) return;
  db.collection("bookings").doc(id).update({
    activityDone: true,
    activityDoneAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* ============================
   OWNER CONTROLS
============================ */

function editBooking(id, current) {
  const operator = prompt("Operator:", current.operator);
  if (!operator) return;

  const amount = prompt("Amount ₹:", current.amount);
  if (!amount || isNaN(amount)) return;

  db.collection("bookings").doc(id).update({
    operator: operator.trim(),
    operatorKey: operator.trim().toLowerCase(),
    amount: Number(amount)
  });
}

function deleteBooking(id) {
  if (!confirm("Delete booking permanently?")) return;
  db.collection("bookings").doc(id).delete();
}

function markPaid(id) {
  db.collection("bookings").doc(id).update({
    status: "Paid",
    paidAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* ============================
   RENDER BOOKINGS
============================ */

function renderBookings(bookings) {
  let html = "";

  bookings.forEach(d => {

    html += `
      <div class="card">
        <b>${d.operator}</b><br>
        📅 ${d.datetime}<br>
        👥 Customers: ${d.customers}<br>
        💰 Amount: ₹${d.amount}<br>
        ✅ Payment: ${d.status}<br>
        🛶 Activity: ${d.activityDone ? "Completed" : "Pending"}<br><br>

        ${
          role === "operator"
          ? `
            <div class="info"><b>UPI ID:</b> ${d.upiId}</div>
            <button class="copy" onclick="copyText('${d.upiId}')">Copy UPI ID</button>

            <div class="info"><b>Amount:</b> ₹${d.amount}</div>
            <button class="copy" onclick="copyText('${d.amount}')">Copy Amount</button>

            <div class="info">
              Open your UPI app manually and complete the payment using above details.
            </div>

            ${
              !d.activityDone
              ? `<button class="done" onclick="confirmActivity('${d.id}')">
                   Confirm Activity Completed
                 </button>`
              : ""
            }
          `
          : `
            ${d.status !== "Paid" ? `<button onclick="markPaid('${d.id}')">Mark Paid</button>` : ""}
            <button onclick='editBooking("${d.id}", ${JSON.stringify(d)})'>Edit</button>
            <button class="danger" onclick="deleteBooking('${d.id}')">Delete</button>
          `
        }
      </div>
    `;
  });

  bookingsDiv.innerHTML = html;
}

const bookingsDiv = document.getElementById("bookings");
</script>

</body>
</html>
