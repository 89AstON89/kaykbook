<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayaking Booking Manager</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  padding: 10px;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
}

input, button, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 5px;
}

.pay {
  background: green;
}
</style>
</head>

<body>

<h2 id="pageTitle">Kayaking Booking Manager</h2>

<!-- OWNER FILTER -->
<div class="card" id="monthFilterBox">
  <b>Filter by Month</b>
  <select id="monthFilter" onchange="applyMonthFilter()">
    <option value="all">All</option>
  </select>
</div>

<!-- OWNER FORM -->
<div class="card" id="ownerForm">
  <input id="operator" placeholder="Operator Name">
  <input id="datetime" type="datetime-local">
  <input id="customers" type="number" placeholder="No of Customers">
  <input id="amount" type="number" placeholder="Amount ₹">
  <button onclick="addBooking()">Add Booking</button>
</div>

<!-- OPERATOR LINK BOX -->
<div class="card" id="linkBox" style="display:none;">
  <b>Operator Link</b>
  <input id="operatorLink" readonly>
  <button onclick="copyLink()">Copy Link</button>
</div>

<!-- BOOKINGS DISPLAY -->
<div id="bookings"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================
   CONFIGURATION
============================ */

const OWNER_UPI = "astonnoronha123@okhdfcbank";

const params = new URLSearchParams(window.location.search);
const role = params.get("role") || "owner";
const bookingId = params.get("id");

/* ============================
   FIREBASE INIT
============================ */

const firebaseConfig = {
  apiKey: "AIzaSyANyCnvvN84F1IKRGQAzoNSiWTcVFjWR3I",
  authDomain: "kaykbook-43ac4.firebaseapp.com",
  projectId: "kaykbook-43ac4",
  storageBucket: "kaykbook-43ac4.firebasestorage.app",
  messagingSenderId: "407645371594",
  appId: "1:407645371594:web:364808bc1d1c0712f10833",
  measurementId: "G-RWD8JJ8M37"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================
   UI MODE CONTROL
============================ */

window.onload = () => {
  const title = document.getElementById("pageTitle");
  const ownerForm = document.getElementById("ownerForm");
  const linkBox = document.getElementById("linkBox");
  const filterBox = document.getElementById("monthFilterBox");

  if (role === "operator") {
    title.innerText = "Pending Payment";
    ownerForm.style.display = "none";
    linkBox.style.display = "none";
    filterBox.style.display = "none";
  } else {
    title.innerText = "Kayaking Booking Manager";
  }
};

/* ============================
   ADD BOOKING
============================ */

function addBooking() {
  if (role !== "owner") return alert("Only owner can create bookings.");

  if (!operator.value || !datetime.value || !customers.value || !amount.value) {
    alert("Please fill all fields.");
    return;
  }

  if (Number(amount.value) <= 0) {
    alert("Amount must be greater than zero.");
    return;
  }

  db.collection("bookings").add({
    operator: operator.value,
    datetime: datetime.value,
    customers: customers.value,
    amount: amount.value,
    upiId: OWNER_UPI,
    status: "Pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(doc => {
    const operatorLink =
      `${location.origin}${location.pathname}?role=operator&id=${doc.id}`;

    document.getElementById("linkBox").style.display = "block";
    document.getElementById("operatorLink").value = operatorLink;
  });
}

/* ============================
   COPY LINK
============================ */

function copyLink() {
  const text = document.getElementById("operatorLink").value;

  navigator.clipboard.writeText(text).then(() => {
    alert("Operator link copied.");
  }).catch(() => {
    alert("Copy failed. Please long press and copy manually.");
  });
}

/* ============================
   PAYMENT LOCK
============================ */

let paymentInProgress = false;

function payNow(link) {
  if (paymentInProgress) return;

  paymentInProgress = true;
  window.location.href = link;

  setTimeout(() => paymentInProgress = false, 5000);
}

/* ============================
   LOAD BOOKINGS
============================ */

let allBookings = [];

let query = db.collection("bookings").orderBy("createdAt","desc");

if (role === "operator" && bookingId) {
  query = db.collection("bookings").where(
    firebase.firestore.FieldPath.documentId(),
    "==",
    bookingId
  );
}

query.onSnapshot(snapshot => {
  allBookings = [];
  const monthSet = new Set();

  snapshot.forEach(doc => {
    const data = doc.data();
    data.id = doc.id;
    allBookings.push(data);

    if (data.datetime) {
      const month = data.datetime.slice(0,7);
      monthSet.add(month);
    }
  });

  populateMonthFilter([...monthSet].sort());
  renderBookings(allBookings);
});

/* ============================
   MONTH FILTER
============================ */

function populateMonthFilter(months) {
  if (role !== "owner") return;

  const select = document.getElementById("monthFilter");
  select.innerHTML = `<option value="all">All</option>`;

  months.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.innerText = m;
    select.appendChild(opt);
  });
}

function applyMonthFilter() {
  const selected = document.getElementById("monthFilter").value;

  if (selected === "all") {
    renderBookings(allBookings);
  } else {
    const filtered = allBookings.filter(b =>
      b.datetime && b.datetime.startsWith(selected)
    );
    renderBookings(filtered);
  }
}

/* ============================
   RENDER BOOKINGS
============================ */

function renderBookings(bookings) {
  let html = "";

  bookings.forEach(d => {
    const txnId = "KAYAK" + Date.now();
    const gpayLink =
      `upi://pay?pa=${encodeURIComponent(d.upiId)}` +
      `&pn=Victory%20Kayaking` +
      `&am=${d.amount}` +
      `&cu=INR` +
      `&tn=Booking%20Payment` +
      `&tr=${txnId}`;

    html += `
      <div class="card">
        <b>${d.operator}</b><br>
        📅 ${d.datetime}<br>
        👥 Customers: ${d.customers}<br>
        💰 ₹${d.amount}<br>
        ✅ Status: ${d.status}<br><br>

        ${
          role === "operator" && d.status !== "Paid"
          ? `<button class="pay" onclick="payNow('${gpayLink}')">Pay Now</button>`
          : ""
        }

        ${
          role === "owner" && d.status !== "Paid"
          ? `<button onclick="markPaid('${d.id}')">Mark Paid</button>`
          : ""
        }
      </div>
    `;
  });

  document.getElementById("bookings").innerHTML = html;
}

/* ============================
   MARK PAID
============================ */

function markPaid(id){
  if (role !== "owner") return alert("Only owner can mark payment.");

  db.collection("bookings").doc(id).update({
    status: "Paid",
    paidAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}
</script>

</body>
</html>
